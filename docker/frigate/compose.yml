services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable-tensorrt
    restart: unless-stopped
    shm_size: "256mb"
    stop_grace_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8971:8971"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    volumes:
      - "${FRIGATE_CONFIG_DIR:-/srv/frigate/config}:/config"
      - "${FRIGATE_STORAGE_DIR:-/srv/frigate/storage}:/media/frigate"
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: "${TZ:-Europe/Paris}"
      FRIGATE_DOME01_USER: "${FRIGATE_DOME01_USER:-}"
      FRIGATE_DOME01_PASSWORD: "${FRIGATE_DOME01_PASSWORD:-}"
      FRIGATE_GARAGE_USER: "${FRIGATE_GARAGE_USER:-}"
      FRIGATE_GARAGE_PASSWORD: "${FRIGATE_GARAGE_PASSWORD:-}"
      FRIGATE_DOORBELL_USER: "${FRIGATE_DOORBELL_USER:-}"
      FRIGATE_DOORBELL_PASSWORD: "${FRIGATE_DOORBELL_PASSWORD:-}"
      FRIGATE_TAPO_USER: "${FRIGATE_TAPO_USER:-}"
      FRIGATE_TAPO_PASSWORD: "${FRIGATE_TAPO_PASSWORD:-}"
