
---
- name: Installation Klipper, Moonraker et Mainsail
  hosts: 3d_printer
  become: true

  vars_files:
    - ../group_vars/3d_printer.yml

  vars:
    mainsail_dir: /var/www/mainsail
    printer_data: "{{ klipper_home }}/printer_data"

  tasks:

    - name: Installer les dépendances système
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        name:
          - git
          - curl
          - wget
          - unzip
          - nginx
          - python3
          - python3-dev
          - python3-venv
          - python3-pip
          - virtualenv
          - build-essential
          - libffi-dev
          - libncurses-dev
          - libusb-dev
          - avrdude
          - gcc-avr
          - binutils-avr
          - avr-libc
          - pkg-config
          - libjpeg-dev
          - zlib1g-dev
          - libopenjp2-7
          - libtiff-dev
          - libatlas-base-dev
        state: present

    - name: Créer le groupe klipper
      ansible.builtin.group:
        name: "{{ klipper_user }}"
        state: present

    - name: Créer l'utilisateur klipper
      ansible.builtin.user:
        name: "{{ klipper_user }}"
        group: "{{ klipper_user }}"
        groups:
          - dialout
          - tty
          - video
        append: true
        create_home: true
        shell: /bin/bash
        state: present

    - name: Créer les dossiers de données
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ klipper_user }}"
        group: "{{ klipper_user }}"
        mode: "0755"
      loop:
        - "{{ printer_data }}"
        - "{{ printer_data }}/config"
        - "{{ printer_data }}/gcodes"
        - "{{ printer_data }}/logs"
        - "{{ printer_data }}/comms"
        - "{{ klipper_home }}/klippy-env"

    # KLIPPER

    - name: Cloner Klipper
      ansible.builtin.git:
        repo: "{{ klipper_repo }}"
        dest: "{{ klipper_home }}/klipper"
        version: master
        update: true
      become_user: "{{ klipper_user }}"

    - name: Créer l'environnement Python Klipper
      ansible.builtin.command:
        cmd: >-
          python3 -m venv
          {{ klipper_home }}/klippy-env
        creates: "{{ klipper_home }}/klippy-env/bin/python"
      become_user: "{{ klipper_user }}"

    - name: Installer les dépendances Python Klipper
      ansible.builtin.pip:
        requirements: "{{ klipper_home }}/klipper/scripts/klippy-requirements.txt"
        virtualenv: "{{ klipper_home }}/klippy-env"
      become_user: "{{ klipper_user }}"

    - name: Installer le service systemd Klipper
      ansible.builtin.copy:
        dest: /etc/systemd/system/klipper.service
        mode: "0644"
        content: |
          [Unit]
          Description=Klipper 3D Printer Firmware Host
          After=network.target

          [Service]
          Type=simple
          User={{ klipper_user }}
          SupplementaryGroups=dialout tty
          WorkingDirectory={{ klipper_home }}/klipper
          ExecStart={{ klipper_home }}/klippy-env/bin/python {{ klipper_home }}/klipper/klippy/klippy.py {{ printer_data }}/config/printer.cfg -l {{ printer_data }}/logs/klippy.log -a {{ printer_data }}/comms/klippy.sock
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
      notify: Restart Klipper

    # MOONRAKER

    - name: Cloner Moonraker
      ansible.builtin.git:
        repo: "{{ moonraker_repo }}"
        dest: "{{ klipper_home }}/moonraker"
        version: master
        update: true
      become_user: "{{ klipper_user }}"

    - name: Créer l'environnement Python Moonraker
      ansible.builtin.command:
        cmd: >-
          python3 -m venv
          {{ klipper_home }}/moonraker-env
        creates: "{{ klipper_home }}/moonraker-env/bin/python"
      become_user: "{{ klipper_user }}"

    - name: Installer les dépendances Moonraker
      ansible.builtin.pip:
        requirements: "{{ klipper_home }}/moonraker/scripts/moonraker-requirements.txt"
        virtualenv: "{{ klipper_home }}/moonraker-env"
      become_user: "{{ klipper_user }}"

    - name: Configurer Moonraker
      ansible.builtin.copy:
        dest: "{{ printer_data }}/config/moonraker.conf"
        owner: "{{ klipper_user }}"
        group: "{{ klipper_user }}"
        mode: "0640"
        content: |
          [server]
          host: 0.0.0.0
          port: 7125
          klippy_uds_address: {{ printer_data }}/comms/klippy.sock

          [file_manager]
          enable_object_processing: True

          [authorization]
          force_logins: False
          cors_domains:
              http://{{ printer_hostname }}
              http://{{ ansible_host }}
          trusted_clients:
              127.0.0.1
              {{ lan_subnet }}

          [history]

          [announcements]

          [update_manager]
          enable_system_updates: False
          enable_packagekit: False
      notify: Restart Moonraker

    - name: Installer Moonraker
      ansible.builtin.command:
        cmd: >-
          {{ klipper_home }}/moonraker/scripts/install-moonraker.sh
          -d {{ printer_data }}
          -c {{ printer_data }}/config/moonraker.conf
      args:
        creates: /etc/systemd/system/moonraker.service
      become_user: "{{ klipper_user }}"
      become: true

    # MAINSAIL

    - name: Télécharger Mainsail
      ansible.builtin.get_url:
        url: https://github.com/mainsail-crew/mainsail/releases/latest/download/mainsail.zip
        dest: /tmp/mainsail.zip
        mode: "0644"

    - name: Créer le répertoire web Mainsail
      ansible.builtin.file:
        path: "{{ mainsail_dir }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Déployer Mainsail
      ansible.builtin.unarchive:
        src: /tmp/mainsail.zip
        dest: "{{ mainsail_dir }}"
        remote_src: true
        owner: www-data
        group: www-data

    - name: Configurer Nginx pour Mainsail et Moonraker
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/mainsail
        mode: "0644"
        content: |
          server {
              listen 80 default_server;
              server_name _;

              root {{ mainsail_dir }};
              index index.html;

              location / {
                  try_files $uri $uri/ /index.html;
              }

              location /websocket {
                  proxy_pass http://127.0.0.1:7125/websocket;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
              }

              location /printer {
                  proxy_pass http://127.0.0.1:7125/printer;
                  proxy_set_header Host $host;
              }

              location /api {
                  proxy_pass http://127.0.0.1:7125/api;
                  proxy_set_header Host $host;
              }

              location /access {
                  proxy_pass http://127.0.0.1:7125/access;
                  proxy_set_header Host $host;
              }

              location /machine {
                  proxy_pass http://127.0.0.1:7125/machine;
                  proxy_set_header Host $host;
              }

              location /server {
                  proxy_pass http://127.0.0.1:7125/server;
                  proxy_set_header Host $host;
              }
          }
      notify: Restart Nginx

    - name: Activer le site Mainsail
      ansible.builtin.file:
        src: /etc/nginx/sites-available/mainsail
        dest: /etc/nginx/sites-enabled/mainsail
        state: link
      notify: Restart Nginx

    - name: Désactiver le site Nginx par défaut
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Restart Nginx

    - name: Vérifier la configuration de l'imprimante
      ansible.builtin.stat:
        path: "{{ printer_data }}/config/printer.cfg"
      register: printer_config

    - name: Activer Klipper
      ansible.builtin.systemd:
        name: klipper
        enabled: true
        state: started
        daemon_reload: true
      when: printer_config.stat.exists

    - name: Indiquer la configuration requise pour démarrer Klipper
      ansible.builtin.debug:
        msg: >-
          Klipper est installé mais reste arrêté : crée
          {{ printer_data }}/config/printer.cfg avec la configuration
          propre à cette imprimante (dont le MCU serial {{ printer_serial }}),
          puis relance ce playbook.
      when: not printer_config.stat.exists

    - name: Activer Moonraker
      ansible.builtin.systemd:
        name: moonraker
        enabled: true
        state: started
        daemon_reload: true

    - name: Activer Nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started

  handlers:
    - name: Restart Klipper
      ansible.builtin.systemd:
        name: klipper
        state: restarted
        daemon_reload: true
      when: printer_config.stat.exists

    - name: Restart Moonraker
      ansible.builtin.systemd:
        name: moonraker
        state: restarted

    - name: Restart Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
