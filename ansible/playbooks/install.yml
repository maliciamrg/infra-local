---
- name: Préparer le serveur Ubuntu pour Docker Compose
  hosts: ubuntu
  become: true

  vars_files:
    - ../group_vars/ubuntu-server/vault.yml

  vars:
    truenas_ip: "192.168.1.111"
    install_nvidia_container_toolkit: false

    # Identifiants SMB à définir dans un fichier Ansible Vault
    smb_credentials_file: /root/.smb-truenas-credentials

    # Partages SMB à monter
    smb_mounts:
      - name: SourceCode
        path: /srv/SourceCode
      - name: WebSite
        path: /srv/WebSite
      - name: Ollama
        path: /srv/Ollama
      - name: Videoclub
        path: /srv/Videoclub
      - name: System
        path: /srv/System
      - name: Photocopie
        path: /srv/Photocopie
      - name: Photo
        path: /srv/Photo
      - name: Home
        path: /srv/Home

    # Partages NFS à monter
    nfs_mounts:
      - remote_path: /mnt/BigBoy/DatabaseBackups
        local_path: /srv/DatabaseBackups

    app_directories:
      - /srv/SourceCode
      - /srv/WebSite
      - /srv/Ollama
      - /srv/Videoclub
      - /srv/System
      - /srv/Photocopie
      - /srv/Photo
      - /srv/Home
      - /srv/Mail
      - /srv/DatabaseBackups
      - /srv/frigate/config
      - /srv/frigate/storage

  tasks:
    - name: Installer les paquets nécessaires
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
          - cifs-utils
          - nfs-common
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Activer Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Installer NVIDIA driver and Container Toolkit for Docker
      when: install_nvidia_container_toolkit | bool
      block:
        - name: Verify the NVIDIA setup targets Ubuntu
          ansible.builtin.assert:
            that:
              - ansible_distribution == "Ubuntu"
            fail_msg: This NVIDIA driver setup is supported only on Ubuntu hosts.

        - name: Install Ubuntu driver detection utility
          ansible.builtin.apt:
            name: ubuntu-drivers-common
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: Check whether the NVIDIA driver is already available
          ansible.builtin.command:
            cmd: nvidia-smi
          register: nvidia_smi
          changed_when: false
          failed_when: false

        - name: Install Ubuntu's recommended NVIDIA driver
          ansible.builtin.command:
            cmd: ubuntu-drivers install
          environment:
            DEBIAN_FRONTEND: noninteractive
          when: nvidia_smi.rc != 0

        - name: Create directory for NVIDIA package signing keys
          ansible.builtin.file:
            path: /usr/share/keyrings
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Install NVIDIA Container Toolkit repository key
          ansible.builtin.get_url:
            url: https://nvidia.github.io/libnvidia-container/gpgkey
            dest: /usr/share/keyrings/nvidia-container-toolkit.asc
            owner: root
            group: root
            mode: "0644"

        - name: Add NVIDIA Container Toolkit package repository
          ansible.builtin.apt_repository:
            repo: "deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit.asc] https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /"
            filename: nvidia-container-toolkit
            state: present
            update_cache: true

        - name: Install NVIDIA Container Toolkit
          ansible.builtin.apt:
            name: nvidia-container-toolkit
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: Check Docker runtime configuration
          ansible.builtin.command:
            cmd: "docker info --format='{% raw %}{{json .Runtimes}}{% endraw %}'"
          register: docker_runtimes
          changed_when: false

        - name: Configure NVIDIA Container Toolkit for Docker
          ansible.builtin.command:
            cmd: nvidia-ctk runtime configure --runtime=docker
          when: "'nvidia' not in (docker_runtimes.stdout | from_json)"
          notify: Restart Docker for NVIDIA runtime

    - name: Ajouter l'utilisateur distant au groupe docker
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Créer les répertoires applicatifs
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0750"
      loop: "{{ app_directories }}"

    # ---------------------------------------------------------
    # IDENTIFIANTS SMB
    # ---------------------------------------------------------

    - name: Vérifier que les identifiants SMB sont définis
      ansible.builtin.assert:
        that:
          - smb_username is defined
          - smb_password is defined
        fail_msg: "Définis smb_username et smb_password dans Ansible Vault."

    - name: Créer le fichier d'identifiants SMB
      ansible.builtin.copy:
        dest: "{{ smb_credentials_file }}"
        content: |
          username={{ smb_username }}
          password={{ smb_password }}
        owner: root
        group: root
        mode: "0600"
      no_log: true

    # ---------------------------------------------------------
    # MONTAGES SMB
    # ---------------------------------------------------------

    - name: Monter les partages SMB TrueNAS
      ansible.posix.mount:
        src: "//{{ truenas_ip }}/{{ item.name }}"
        path: "{{ item.path }}"
        fstype: cifs
        opts: "credentials={{ smb_credentials_file }},vers=3.1.1,iocharset=utf8,_netdev,nofail,x-systemd.automount"
        dump: "0"
        passno: "0"
        state: mounted
      loop: "{{ smb_mounts }}"
      loop_control:
        label: "{{ item.name }}"

    # ---------------------------------------------------------
    # MONTAGES NFS
    # ---------------------------------------------------------

    - name: Monter les partages NFS TrueNAS
      ansible.posix.mount:
        src: "{{ truenas_ip }}:{{ item.remote_path }}"
        path: "{{ item.local_path }}"
        fstype: nfs4
        opts: "rw,hard,_netdev,nofail,x-systemd.automount"
        dump: "0"
        passno: "0"
        state: mounted
      loop: "{{ nfs_mounts }}"
      loop_control:
        label: "{{ item.remote_path }}"

  handlers:
    - name: Restart Docker for NVIDIA runtime
      ansible.builtin.service:
        name: docker
        state: restarted
