---
- name: Installer les dépendances
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name: [git, curl, wget, unzip, nginx, python3, python3-venv, python3-dev, python3-pip, build-essential, libffi-dev, libssl-dev, libjpeg-dev, zlib1g-dev, libopenjp2-7, avrdude]
    state: present
- name: Créer utilisateur Klipper
  ansible.builtin.user:
    name: "{{ printer_user }}"
    home: "{{ printer_home }}"
    create_home: true
    shell: /bin/bash
    groups: [dialout, video]
    append: true
- name: Créer répertoires de données
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ printer_user }}"
    group: "{{ printer_user }}"
    mode: "0755"
  loop:
    - "{{ printer_data }}"
    - "{{ printer_data }}/config"
    - "{{ printer_data }}/logs"
    - "{{ printer_data }}/gcodes"
    - "{{ printer_data }}/comms"
    - "{{ printer_data }}/systemd"
- name: Détecter ancienne configuration
  ansible.builtin.stat:
    path: /root/printer_data/config/printer.cfg
  register: old_cfg
- name: Copier ancienne configuration en sauvegarde
  ansible.builtin.copy:
    src: /root/printer_data/config/printer.cfg
    dest: "{{ printer_data }}/config/printer.cfg.before-ansible"
    remote_src: true
    owner: "{{ printer_user }}"
    group: "{{ printer_user }}"
    mode: "0640"
  when: old_cfg.stat.exists
